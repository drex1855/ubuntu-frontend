<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#15191a"/>
  <rect x="0" y="0" width="400" height="6" fill="#00a884" opacity="0.4"/>

  <!-- monitor -->
  <g transform="translate(130,80)">
    <rect x="0" y="0" width="150" height="95" rx="6" fill="#1c2222" stroke="#4a5555" stroke-width="2"/>
    <rect x="8" y="8" width="134" height="79" rx="3" fill="#0d1111"/>
    <polyline points="16,60 34,40 52,66 70,30 88,52 106,24 124,48 134,38"
              fill="none" stroke="#00a884" stroke-width="2.5"/>
    <rect x="66" y="95" width="18" height="18" fill="#2a3232"/>
    <rect x="50" y="113" width="50" height="6" rx="3" fill="#2a3232"/>
  </g>

  <!-- keyboard -->
  <rect x="95" y="200" width="210" height="30" rx="6" fill="#1c2222" stroke="#3a4444" stroke-width="2"/>
  <g fill="#3a4444">
    <rect x="105" y="207" width="10" height="8" rx="1"/>
    <rect x="120" y="207" width="10" height="8" rx="1"/>
    <rect x="135" y="207" width="10" height="8" rx="1"/>
    <rect x="150" y="207" width="10" height="8" rx="1"/>
    <rect x="165" y="207" width="10" height="8" rx="1"/>
    <rect x="180" y="207" width="10" height="8" rx="1"/>
    <rect x="195" y="207" width="10" height="8" rx="1"/>
    <rect x="210" y="207" width="10" height="8" rx="1"/>
    <rect x="225" y="207" width="10" height="8" rx="1"/>
    <rect x="240" y="207" width="10" height="8" rx="1"/>
    <rect x="255" y="207" width="10" height="8" rx="1"/>
    <rect x="270" y="207" width="10" height="8" rx="1"/>
    <rect x="130" y="217" width="90" height="7" rx="2"/>
  </g>

  <!-- mic on boom arm -->
  <g transform="translate(320,60)">
    <path d="M0 140 C -10 60 20 40 30 20" fill="none" stroke="#3a4242" stroke-width="4"/>
    <rect x="18" y="-6" width="24" height="46" rx="12" fill="#1a1f1f" stroke="#00a884" stroke-width="2.5"/>
  </g>

  <!-- desk edge -->
  <rect x="0" y="240" width="400" height="60" fill="#0f1313"/>
  <rect x="0" y="238" width="400" height="3" fill="#6d7d7d" opacity="0.4"/>
</svg>
