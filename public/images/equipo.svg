    <circle cx="140" cy="20" r="4" fill="#00a884"/>
    <rect x="70" y="105" width="20" height="16" fill="#2a3232"/>
    <rect x="50" y="121" width="60" height="7" rx="3" fill="#2a3232"/>
  </g>

  <!-- 24/7 badge -->
  <g transform="translate(300,110)">
    <circle r="34" fill="#101414" stroke="#00a884" stroke-width="3"/>
    <text x="0" y="6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
          fill="#ffffff" text-anchor="middle">24/7</text>
  </g>

  <!-- three team silhouettes -->
  <g transform="translate(90,330)">
    <circle cx="0" cy="0" r="22" fill="#e3a97a"/>
    <path d="M-22 0 a22 22 0 0 1 44 0 v-5 a22 26 0 0 0 -44 0 Z" fill="#241a12"/>
    <path d="M-28 70 C -28 34 -12 18 0 18 C 12 18 28 34 28 70 Z" fill="#6d7d7d"/>
  </g>
  <g transform="translate(200,320)">
