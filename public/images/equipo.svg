<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00a884" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00a884" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#151a1a"/>
  <circle cx="200" cy="220" r="190" fill="url(#eGlow)"/>

  <!-- big screen with graph -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="160" height="105" rx="8" fill="#1c2222" stroke="#4a5555" stroke-width="3"/>
    <rect x="10" y="10" width="140" height="85" rx="4" fill="#0c1010"/>
    <polyline points="20,75 45,55 65,68 90,35 115,50 140,20"
