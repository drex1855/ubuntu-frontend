    <path d="M-26 -2 a26 26 0 0 1 52 0 v8 a26 30 0 0 0 -52 0 Z" fill="#3a2a1e"/>
    <path d="M-32 78 C -32 38 -14 20 0 20 C 14 20 32 38 32 78 Z" fill="#00a884"/>
  </g>
  <g transform="translate(310,332)">
    <circle cx="0" cy="0" r="20" fill="#c98a5c"/>
    <path d="M-20 -1 a20 20 0 0 1 40 0 v6 a20 24 0 0 0 -40 0 Z" fill="#1a1210"/>
    <path d="M-25 64 C -25 32 -11 16 0 16 C 11 16 25 32 25 64 Z" fill="#ffffff" opacity="0.85"/>
