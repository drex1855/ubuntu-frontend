<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#131717"/>

  <!-- vanity mirror with bulbs -->
  <g transform="translate(200,150)">
    <rect x="-90" y="-100" width="180" height="150" rx="10" fill="#1a1f1f" stroke="#4a5555" stroke-width="3"/>
    <rect x="-78" y="-88" width="156" height="126" rx="6" fill="#0c1010"/>
    <g fill="#00a884">
      <circle cx="-90" cy="-100" r="5"/>
      <circle cx="-45" cy="-100" r="5"/>
      <circle cx="0" cy="-100" r="5"/>
      <circle cx="45" cy="-100" r="5"/>
      <circle cx="90" cy="-100" r="5"/>
      <circle cx="-90" cy="50" r="5"/>
      <circle cx="-45" cy="50" r="5"/>
      <circle cx="0" cy="50" r="5"/>
      <circle cx="45" cy="50" r="5"/>
      <circle cx="90" cy="50" r="5"/>
    </g>
    <g fill="#ffffff" opacity="0.85">
      <circle cx="-90" cy="-25" r="5"/>
      <circle cx="90" cy="-25" r="5"/>
    </g>
  </g>

  <!-- console table -->
  <rect x="70" y="225" width="260" height="14" rx="4" fill="#242c2c" stroke="#3a4444" stroke-width="2"/>
  <line x1="90" y1="239" x2="90" y2="280" stroke="#3a4444" stroke-width="5"/>
  <line x1="310" y1="239" x2="310" y2="280" stroke="#3a4444" stroke-width="5"/>

  <!-- perfume/props -->
  <rect x="120" y="205" width="12" height="20" rx="2" fill="#3a4444"/>
  <rect x="140" y="198" width="10" height="27" rx="2" fill="#00a884" opacity="0.7"/>
  <circle cx="270" cy="214" r="10" fill="#3a4444"/>
</svg>
