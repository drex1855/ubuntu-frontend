<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00a884" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00a884" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#161c1c"/>
  <circle cx="200" cy="150" r="180" fill="url(#nGlow)"/>

  <!-- small ring icon above -->
  <g transform="translate(200,110)">
    <circle r="46" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle r="46" fill="none" stroke="#0f1212" stroke-width="6" stroke-dasharray="1 12"/>
    <circle r="18" fill="#0a0d0d" stroke="#00a884" stroke-width="3"/>
    <circle r="6" fill="#00a884"/>
  </g>

  <!-- bench -->
  <rect x="60" y="380" width="280" height="16" rx="6" fill="#242c2c"/>
  <line x1="90" y1="396" x2="90" y2="430" stroke="#242c2c" stroke-width="8"/>
  <line x1="310" y1="396" x2="310" y2="430" stroke="#242c2c" stroke-width="8"/>

  <!-- figure 1: mentora -->
  <g transform="translate(150,300)">
    <circle cx="0" cy="0" r="26" fill="#f2c9a0"/>
    <path d="M-26 0 a26 26 0 0 1 52 0 v-6 a26 30 0 0 0 -52 0 Z" fill="#3a2a1e"/>
    <path d="M-34 84 C -34 40 -14 20 0 20 C 14 20 34 40 34 84 Z" fill="#00a884"/>
    <path d="M20 40 C 40 46 46 66 42 84" fill="none" stroke="#00a884" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- figure 2: modelo -->
  <g transform="translate(250,300)">
    <circle cx="0" cy="0" r="26" fill="#e3a97a"/>
    <path d="M-26 -2 a26 26 0 0 1 52 0 v10 a26 34 0 0 0 -52 0 Z" fill="#1a1210"/>
    <path d="M-34 84 C -34 40 -14 20 0 20 C 14 20 34 40 34 84 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M-20 40 C -40 46 -46 66 -42 84" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- floating icons: growth -->
  <g stroke="#00a884" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <polyline points="60,220 60,205 75,205" transform="translate(0,0)"/>
    <polyline points="46,236 66,214 80,228 100,200" transform="translate(-10,-30)"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <path d="M320 190 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 z"/>
  </g>
</svg>
